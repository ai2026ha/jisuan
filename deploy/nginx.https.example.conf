# 使用前：
# 1) 把 YOUR_DOMAIN 改成你的真实域名；
# 2) 把证书放到 deploy/certs/fullchain.pem 和 deploy/certs/privkey.pem；
# 3) docker-compose.yml 的 nginx ports 增加 "443:443"；
# 4) nginx volumes 增加 ./deploy/certs:/etc/nginx/certs:ro；
# 5) 用本文件替换 deploy/nginx.conf；
# 6) .env 中 SESSION_COOKIE_SECURE=1，然后 docker compose up -d --build。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream agent_calculator_app {
    server app:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 110m;

    location /ws {
        proxy_pass http://agent_calculator_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://agent_calculator_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
